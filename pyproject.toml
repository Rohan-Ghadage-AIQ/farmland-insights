[project]
name = "farmland"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "earthengine-api>=1.7.22",
    "fastapi[all]>=0.136.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "propelauth-fastapi>=4.4.0",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.4.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call external services when explicitly enabled",
]
